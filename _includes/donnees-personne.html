{%- comment -%} Données structurées (schema.org) de l'autrice, pour les moteurs de recherche. Affichées nulle part. {%- endcomment -%}
{%- assign s = site.data.site -%}
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "Person", "name": {{ s.nom | jsonify }}, "description": {{ s.signature | jsonify }}, "url": {{ '/' | absolute_url | jsonify }}, "image": {{ '/assets/img/photos/' | append: site.data.accueil.heros.photo | absolute_url | jsonify }}, "sameAs": [{% for r in s.reseaux %}{{ r.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]}
</script>
