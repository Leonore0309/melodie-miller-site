{% assign m = site.data.textes.menu %}
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">{{ site.data.site.nom }}</a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="menu">{{ m.bouton }}</button>
    <nav id="menu" class="menu" aria-label="{{ m.label | escape }}">
      {% for e in m.liens %}{% if e.sous_menu %}<div class="menu-groupe">
        <a href="{{ e.lien | relative_url | escape }}"{% if page.url == e.lien %} aria-current="page"{% endif %}>{{ e.texte }} <span class="caret" aria-hidden="true">▾</span></a>
        <div class="sous-menu">
          {% for s in e.sous_menu %}<a href="{{ s.lien | relative_url | escape }}"{% if page.url == s.lien %} aria-current="page"{% endif %}>{{ s.texte }}</a>
          {% endfor %}</div>
      </div>
      {% else %}<a href="{{ e.lien | relative_url | escape }}"{% if page.url == e.lien %} aria-current="page"{% endif %}>{{ e.texte }}</a>
      {% endif %}{% endfor %}</nav>
  </div>
</header>
