{%- comment -%} Petite icône de réseau social (SVG intégré, prend la couleur du texte). Paramètre : nom (instagram, facebook, tiktok) {%- endcomment -%}
{%- assign n = include.nom | downcase -%}
<svg class="icone" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if n == "instagram" -%}
<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
{%- elsif n == "facebook" -%}
<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>
{%- elsif n == "tiktok" -%}
<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.1 4.2 5 4.4"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
