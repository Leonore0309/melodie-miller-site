title: "Mélodie Miller"
description: "Mélodie Miller, autrice de romans feel good, de comédies romantiques et de thrillers psychologiques."
# Site publié par GitHub Pages sur le domaine melodiemiller.fr (réglé dans GitHub > Settings > Pages, DNS chez Ionos).
url: "https://melodiemiller.fr"
baseurl: ""

# true = site caché des moteurs de recherche (balise noindex et robots.txt fermé). false = site visible dans Google.
noindex: false
lang: fr
author: "Mélodie Miller"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  extraits:
    output: true
    permalink: /extraits/:name/

defaults:
  - scope:
      path: ""
      type: "extraits"
    values:
      layout: extrait
      # Page web (et non article de blog) dans les métadonnées. Ajouter « date: AAAA-MM-JJ » dans l'en-tête
      # d'un extrait, sinon chaque publication lui attribue la date du jour.
      seo:
        type: WebPage
  # Image affichée quand une page du site est partagée (réseaux sociaux, messageries). Refaite par outils/partage.py.
  - scope:
      path: ""
    values:
      image: /assets/img/partage.jpg

exclude:
  - README.md
  - GUIDE-MELODIE.md
  - CLAUDE.md
  - AUDIT.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - outils/
  - dist/
