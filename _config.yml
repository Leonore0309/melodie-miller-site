title: "Mélodie Miller"
description: "Mélodie Miller, autrice de romans feel good, de comédies romantiques et de thrillers psychologiques."
# Maquette en ligne sur GitHub Pages (sous-dossier). Le jour du passage sur le vrai domaine :
#   url: "https://melodiemiller.fr"  et  baseurl: ""  (+ fichier CNAME, voir README)
url: "https://leonore0309.github.io"
baseurl: "/melodie-miller-site"

# Maquette non indexée par les moteurs de recherche (balise noindex). Passer à false à la mise en ligne réelle.
noindex: true
lang: fr
author: "Mélodie Miller"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  extraits:
    output: true
    permalink: /extraits/:name/

defaults:
  - scope:
      path: ""
      type: "extraits"
    values:
      layout: extrait
      # Page web (et non article de blog) dans les métadonnées. Ajouter « date: AAAA-MM-JJ » dans l'en-tête
      # d'un extrait, sinon chaque publication lui attribue la date du jour.
      seo:
        type: WebPage
  # Image affichée quand une page du site est partagée (réseaux sociaux, messageries). Refaite par outils/partage.py.
  - scope:
      path: ""
    values:
      image: /assets/img/partage.jpg

exclude:
  - README.md
  - GUIDE-MELODIE.md
  - CLAUDE.md
  - AUDIT.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - outils/
  - dist/
