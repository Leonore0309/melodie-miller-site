---
layout: default
---
{% assign l = site.data.livres.livres | where: "id", page.livre | first %}
<article class="extrait container-lecture" data-univers="{{ l.univers }}">
  <p class="fil"><a href="{{ '/' | relative_url }}{% if l.univers == 'thriller' %}thrillers/{% else %}romances-feel-good/{% endif %}#{{ l.id }}">&larr; Retour au livre</a></p>
  <h1>{{ l.titre }}</h1>
  <p class="extrait-sous">Les premiers chapitres</p>
  <div class="extrait-texte">
    {{ content }}
  </div>
  {% if l.liens.size > 0 %}
  <p class="extrait-fin">Envie de connaître la suite ?</p>
  <p class="boutons">
    {% for lien in l.liens %}<a class="btn" href="{{ lien.url }}" rel="noopener">{{ lien.nom }}</a>{% endfor %}
  </p>
  {% endif %}
</article>
