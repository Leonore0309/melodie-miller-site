titre: "Une romantique optimiste et maladroite, passionnée de thrillers"
photo: "portrait.jpg"
photo_alt: "Portrait de Mélodie Miller"
photo2: "piscine.jpg"
photo2_alt: "Mélodie Miller écrit dans un carnet au bord d'une piscine"
photo2_legende: "L'écriture en voyage"
paragraphes:
  - "Je suis une rêveuse optimiste, hypersensible et cauchemardeuse ! Ma famille (mariée, quatre enfants, un chien) est ma passion ; la lecture, le cinéma et l'écriture sont mes activités préférées depuis l'enfance. Mélodie Miller est mon nom de plume."
  - "En 2020, un tour du monde familial m'inspire l'écriture d'un guide pratique *En avant pour un tour du monde*, publié chez Casa Editions."
  - "En 2022, je décide de réaliser mon rêve : écrire des romans. Je publie en autoédition *Il n'est jamais trop tard pour libérer les licornes*, une romance feel good restée deux mois dans le top 20 Amazon."
  - "En 2024, j'ose enfin publier mon premier thriller, *Nuit*. Viennent ensuite *Le Serment*, *La mariée de la fosse* et *Les disparues de la crypte*."
  - "Je regarde des comédies romantiques, je lis de la poésie et je dévore des thrillers et des polars. Je suis notamment fan de Stephen King, Harlan Coben, Olivier Norek, Camilla Läckberg, Lisa Regan et Dennis Lehane. Et j'adore le podcast *L'Heure du crime* !"
  - "Aujourd'hui, je suis autrice indépendante à plein temps, je vis de ma plume, je produis mes livres audio et j'accompagne d'autres passionnés d'écriture."
  - "Derrière mon nom de plume se trouve aussi Valérie Pierson, ancienne dirigeante dans le luxe. Je partage ce parcours lors de conférences dédiées à la créativité, l'audace et à la réinvention."
fin:
  titre: "Et vous, quels rêves avez-vous laissés de côté ?"
  texte: "Si mes romans pouvaient vous transmettre une seule chose, ce serait celle-ci : il n'est jamais trop tard pour oser, pour aimer, pour se réinventer. Et surtout, il n'est jamais trop tard pour libérer ses licornes."
  bouton: "Découvrir mes conférences"
