voix:
  titre: "Une collaboration mère-fille"
  texte:
    - "La voix principale de mes livres audio est celle de Léonore Vanier, ma fille. Une aventure à deux, entre le studio d'enregistrement et les coulisses de mes histoires."
    - "Comédienne et productrice artistique, elle donne vie à mes personnages avec sa sensibilité et sa fantaisie."
