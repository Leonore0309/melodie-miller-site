# Page « En audio ». Les livres audio eux-mêmes sont dans livres.yml (partie « audio » de chaque livre).
titre: "En audio"
accroche: "Laissez-vous raconter mes histoires."
intro:
  - "Fermez les yeux, enfilez vos écouteurs : mes romans prennent aussi vie en livres audio, notamment dans la voix de Léonore Vanier."
  - "Des plages ensoleillées d'Ibiza aux carrières sombres de l'Yonne, choisissez votre ambiance."

surtitre: "Livres audio"
bouton_ecouter: "▶ Écouter"
bouton_prevenir: "Me prévenir de la sortie"
visuel_alt: "Version audio de"
# Les livres audio sont ceux de livres.yml qui ont une partie « audio ». Un groupe par univers, dans cet ordre.
groupes:
  - { univers: feelgood, titre: "Romances", label: "Romances en audio", classe: "audio-romances" }
  - { univers: thriller, titre: "Thrillers", label: "Thrillers en audio", classe: "audio-thrillers" }

voix:
  titre: "Une collaboration mère-fille"
  texte:
    - "La voix principale de mes livres audio est celle de Léonore Vanier, ma fille. Une aventure à deux, entre le studio d'enregistrement et les coulisses de mes histoires."
    - "Comédienne et productrice artistique, elle donne vie à mes personnages avec sa sensibilité et sa fantaisie."
  photo: "studio-duo.jpg"
  photo_alt: "Mélodie Miller et Léonore Vanier au casque, dans le studio d'enregistrement"
  photo_legende: "De gauche à droite : Mélodie Miller et Léonore Vanier"
  lien: "https://lacompagniesensibleindocile.fr/leonore_vanier/audio/"
  lien_texte: "Découvrir le profil audio de Léonore Vanier"
  photo2: "studio-trio-chum.jpg"
  photo2_alt: "Léonore Vanier, Mélodie Miller et Lewis Martin au casque, avec Un chum pour Noël"
  photo2_legende: "Un chum pour Noël, de gauche à droite : Léonore Vanier, Mélodie Miller et Lewis Martin"
