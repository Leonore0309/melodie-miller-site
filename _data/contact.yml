ailleurs:
  titre: "Retrouvons-nous ailleurs"
  texte: "Retrouvez-moi également sur Instagram, Facebook et TikTok pour suivre mon actualité, mes inspirations, les coulisses de mes romans et quelques petits morceaux de mon quotidien."
  newsletter: "Et si vous souhaitez recevoir mes nouvelles directement dans votre boîte mail, inscrivez-vous à ma newsletter."
