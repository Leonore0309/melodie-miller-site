titre: "On s'écrit ?"
paragraphes:
  - "Une question, un message après avoir terminé un roman, une proposition de rencontre ou simplement l'envie de me raconter ce que mes personnages vous ont fait vivre ? J'adore recevoir vos messages."
  - "Écrivez-moi à l'adresse ci-dessous, ou choisissez le sujet de votre message : votre messagerie s'ouvrira avec l'objet déjà rempli."
  - "Je lis vos courriers avec beaucoup d'attention, même si les personnages de mes romans essaient parfois de monopoliser mes journées."
