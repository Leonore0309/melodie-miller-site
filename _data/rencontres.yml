titre: "Les histoires sont encore plus belles quand on les partage"
photo: "dedicace.jpg"
photo_alt: "Mélodie Miller dédicace ses livres à la Librairie du Marché de Fontainebleau"
photo_legende: "Séance de dédicace, Librairie du Marché"
paragraphes:
  - "L'écriture est une activité solitaire."
  - "Quel bonheur alors de vous rencontrer, chers lecteurs et lectrices. En lisant mes romans, c'est vous qui leur donnez vie !"
  - "Dans les salons du livre, les librairies ou lors de rencontres littéraires, j'adore découvrir vos réactions, entendre vos théories sur mes intrigues et savoir quels personnages vous ont le plus touchés ou tenus éveillés."

