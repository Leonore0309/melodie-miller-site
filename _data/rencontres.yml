    - { quand: "28 novembre 2026", debut: "2026-11-28", fin: "2026-11-28", titre: "Salon du livre de Darois", lieu: "21 Darois", lien: "" }
    - { quand: "20-21 mars 2027", debut: "2027-03-20", fin: "2027-03-21", titre: "Salon Pile à Lire", lieu: "76 Rouen", lien: "" }
    - { quand: "7-8 mai 2027", debut: "2027-05-07", fin: "2027-05-08", titre: "Salon du Polar", lieu: "77 Varennes sur Seine", lien: "" }
    - { quand: "29-30 mai 2027", debut: "2027-05-29", fin: "2027-05-30", titre: "Salon L'Escargot Noir", lieu: "89 Sens", lien: "" }

