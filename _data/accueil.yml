heros:
  titre: "Mélodie Miller"
  accroche: "Des histoires pour rêver, rire, aimer… et parfois trembler."
  paragraphes:
    - "Bienvenue dans mon univers ! Autrice de romans feel good, de comédies romantiques et de thrillers psychologiques, la vie est mon inspiration."
    - "J'explore nos rêves, nos secrets, nos peurs, nos traumatismes et notre capacité à nous réinventer. J'aime les personnages imparfaits, les émotions fortes, les voyages qui changent une vie et les intrigues à suspense."
    - "Plus de 70 000 lecteurs ont déjà embarqué. Et si vous étiez les prochains ?"
  photo: "portrait.jpg"
  photo_alt: "Portrait souriant de Mélodie Miller"

deux_univers:
  titre: "Deux univers, une même passion : les émotions"
  lumiere:
    titre: "Envie de lumière ?"
    texte: "Direction Ibiza, le Québec ou la Polynésie ! Entre amitié, amour, humour et nouveaux départs, découvrez mes romans feel good et mes comédies romantiques. Des histoires drôles et touchantes qui font du bien."
    bouton: "Découvrir mes romances"
    couverture: "manon-1.jpg"
    couverture_alt: "Couverture de Il n'est jamais trop tard pour libérer les licornes"
  frissons:
    titre: "Envie de frissons ?"
    texte: "Direction vos cauchemars : peur du noir, de se perdre, de disparaître, de sombrer dans la folie… Entre cold case, tueurs en série et démons du passé, mes thrillers psychologiques vous tiendront éveillés toute la nuit."
    bouton: "Découvrir mes thrillers"
    couverture: "mariee-de-la-fosse.jpg"
    couverture_alt: "Couverture de La mariée de la fosse"

en_ce_moment: "À découvrir en ce moment"
temoignages_titre: "Les lectrices en parlent"

lettre:
  titre: "La lettre de Mélodie"
  texte: "J'aime autant échanger avec mes lectrices qu'inventer de nouvelles histoires ! Dans ma newsletter, je vous raconte les coulisses de mes romans, mes inspirations, mes voyages, et mes recettes préférées. Je vous y réserve aussi des conseils d'écriture et des promotions exclusives."
  bouton: "Je rejoins les coulisses"
  photo: "bisou.jpg"
  photo_alt: "Mélodie Miller envoie un baiser"
